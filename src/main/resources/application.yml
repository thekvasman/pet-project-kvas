server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/clientdb
    username: user
    password: pass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgresSQLDialect
  kafka:
    bootstrap-servers: kafka:9092

discount: 10%
